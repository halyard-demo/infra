# Opened by Arcturel Assay: Dependabot checks these dependencies every week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "terraform"
    directory: "/aws"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "terraform"
    directory: "/github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
