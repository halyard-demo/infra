name: cdk-changeset
# Customer CI (halyard-demo/infra): synthesizes the CDK app for each pull request that touches it, makes a change set from the synthesized template, and never executes it. Assay reads it.
# The app turns the bootstrap-version rule off (bin/halyard.ts), so the stack is deployed without `cdk bootstrap`.
on:
  pull_request:
    paths: ['cdk/**']
permissions:
  id-token: write
  pull-requests: write
  contents: read
jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synthesize the app
        working-directory: cdk
        run: |
          npm ci
          npx cdk synth --no-version-reporting --quiet
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363776342490:role/halyard-cfn-changeset-role
          aws-region: us-east-1
      - name: Create the change set (never executed)
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAME="pr-${NUMBER}-${HEAD::7}"
          aws cloudformation create-change-set --stack-name halyard-cdk-data --change-set-name "$NAME" --change-set-type UPDATE \
            --template-body file://cdk/cdk.out/halyard-cdk-data.template.json --description "pull request ${NUMBER}, commit ${HEAD}"
          aws cloudformation wait change-set-create-complete --stack-name halyard-cdk-data --change-set-name "$NAME" || true
          aws cloudformation describe-change-set --stack-name halyard-cdk-data --change-set-name "$NAME" > describe.json
          cat describe.json
      - name: Show what the CDK says changes (cdk diff)
        working-directory: cdk
        run: npx cdk diff --no-version-reporting halyard-cdk-data 2>&1 | tee ../cdk-diff.txt || true
      - name: Post what the change set shows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```json'; cat describe.json; echo '```'; echo; echo 'cdk diff:'; echo '```'; cat cdk-diff.txt; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
