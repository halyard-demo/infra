name: terraform-plan
on:
  pull_request:
    paths:
      - 'aws/**'
      - '.github/workflows/terraform-plan.yml'
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      # Read-only: this role can read the account and the state, and cannot change either.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363776342490:role/halyard-infra-plan
          aws-region: us-east-1
      - run: terraform init -input=false
      - id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('aws/plan.txt', 'utf8')
            const marker = '<!-- terraform-plan -->'
            const body = `${marker}\n### Terraform plan\n\n<details><summary>Show the plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
      - if: steps.plan.outputs.exit != '0'
        run: exit 1
