name: cdk-deploy
# Customer CI (halyard-demo/infra): deploys the CDK app when a change merges to main. This is the customer's deploy, never Assay's.
on:
  push:
    branches: [main]
    paths: ['cdk/**']
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Synthesize the app
        working-directory: cdk
        run: |
          npm ci
          npx cdk synth --no-version-reporting --quiet
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363776342490:role/halyard-cfn-deploy-role
          aws-region: us-east-1
      - run: aws cloudformation deploy --stack-name halyard-cdk-data --template-file cdk/cdk.out/halyard-cdk-data.template.json --no-fail-on-empty-changeset --tags arcturel:proof=784-cdk
