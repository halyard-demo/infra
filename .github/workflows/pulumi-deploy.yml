name: pulumi-deploy
# Customer CI (halyard-demo/infra): deploys the Pulumi program when a change that touches it merges to main. The first run creates the stack.
on:
  push:
    branches: [main]
    paths: ['pulumi/**']
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363776342490:role/halyard-pulumi-deploy-role
          aws-region: us-east-1
      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: proof
          work-dir: pulumi
          cloud-url: s3://halyard-pulumi-state-363776342490
          secrets-provider: passphrase
          upsert: true
