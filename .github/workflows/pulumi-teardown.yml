name: pulumi-teardown
# Proof teardown only (halyard-demo/infra): removes the Pulumi Cloud stack arcturel/halyard-cloud/dev, after its bucket was deleted by hand. Removed again in the restore pull request.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pulumi/setup-pulumi@v2
      - name: Remove the stack
        working-directory: pulumi
        run: |
          pulumi login
          pulumi stack rm arcturel/halyard-cloud/dev --force --yes
