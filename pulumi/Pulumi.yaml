name: halyard
runtime: yaml
description: The data bucket of the halyard demo (Arcturel proof 529-pulumi)

resources:
  # The bucket the demo's data lives in (uploads for the app).
  dataBucket:
    type: aws:s3:BucketV2
    properties:
      bucket: halyard-pulumi-data-363776342490
      tags:
        arcturel:proof: 529-pulumi

  dataPublicAccessBlock:
    type: aws:s3:BucketPublicAccessBlock
    properties:
      bucket: ${dataBucket.id}
      blockPublicAcls: true
      blockPublicPolicy: true
      ignorePublicAcls: true
      restrictPublicBuckets: true
